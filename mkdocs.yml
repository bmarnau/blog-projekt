site_name: System Engineering & KI-Praxis
site_url: https://bmarnau.github.io/blog-projekt/
site_description: Praxisberichte über KI-gestützte Softwareentwicklung aus dem Systemhaus-Alltag.
site_author: Bernd Marnau

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Zum Nacht-Design wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Zum Tages-Design wechseln
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.sections
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - attr_list
  - md_in_html

nav:
  - Start: index.md
  - Artikel: artikel/index.md
  - Themen: themen/index.md
  - Über mich: ueber-mich.md
  - Arbeitsbereich:
      - Hinweise & Entscheidungen: intern/hinweise.md
      - Artikelvorlage: intern/artikelvorlage.md
