name: Blog prüfen

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: blog-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Inhalt und Website
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Navigation, Seiten und lokale Links prüfen
        run: python scripts/check_content.py
      - name: Website streng bauen
        run: mkdocs build --strict
